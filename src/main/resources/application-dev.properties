spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_platform}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:travel_user}
spring.datasource.password=${DB_PASSWORD:travel_pass}

spring.jpa.show-sql=true

spring.flyway.locations=classpath:db/migration,classpath:db/seed

app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-0123456789abcdef}

logging.level.com.example.travel=DEBUG
