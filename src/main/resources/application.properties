spring.application.name=travel-platform
spring.profiles.active=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Map entity field names straight through to column names, so camelCase fields become
# camelCase columns. Without this Spring Boot's default strategy would convert them to
# snake_case. Table names are still declared explicitly via @Table and stay snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

server.port=8080

# Password assigned to accounts created by an admin via POST /api/v1/users. Phase 1 has no
# password-reset flow, so this stays valid until changed another way — override it per
# environment rather than shipping this value anywhere real.
app.security.default-new-user-password=${DEFAULT_NEW_USER_PASSWORD:Pakistan123}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
